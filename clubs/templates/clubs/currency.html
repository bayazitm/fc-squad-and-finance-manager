{% extends 'clubs/base.html' %}{% block content %}<section class="panel form-panel"><h2>{{ club }}</h2><p class="subtle-note">Bu etiket kulübün tutarlarını yorumlamak içindir; kur dönüşümü yapmaz. Mevcut kayıtlar farklı para birimlerindeyse tek etiket seçmeden önce veriyi gözden geçir.</p><form method="post" class="record-form">{% csrf_token %}<div class="field"><label for="currency">Para birimi</label><select id="currency" name="currency"><option value="UNKNOWN">Belirtilmedi</option><option value="EUR" {% if club_setting.currency == 'EUR' %}selected{% endif %}>EUR</option><option value="TRY" {% if club_setting.currency == 'TRY' %}selected{% endif %}>TRY</option><option value="USD" {% if club_setting.currency == 'USD' %}selected{% endif %}>USD</option></select></div><div class="form-footer"><button class="btn primary">Kaydet</button></div></form></section>{% endblock %}
